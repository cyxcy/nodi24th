<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    
    <!-- Google Fonts for elegant typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrolling from floating animations */
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent; /* Removes touch highlight on mobile */
        }

        h1, h2, .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Romantic animated gradient background */
        .bg-animated {
            background: linear-gradient(-45deg, #ffe5e5, #ffdac6, #fbcfe8, #fecaca, #fff0f5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Effect for the final frame */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            max-width: 480px; /* roomy container */
        }

        /* Vertical Oval shape for the Portrait GIF */
        .oval-gif-container {
            width: 240px;
            height: 380px;
            border-radius: 50%; /* 50% border radius on a non-square container creates a perfect oval */
            max-width: 70vw; /* responsiveness for smaller phones */
            max-height: calc(70vw * 1.58); /* maintain aspect ratio roughly */
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            bottom: -10vh;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background-color: #f43f5e;
            clip-path: path('M15 27.5C15 27.5 30 18.5 30 9.5C30 4.5 25.5 0 20 0C17 0 15 2.5 15 2.5C15 2.5 13 0 10 0C4.5 0 0 4.5 0 9.5C0 18.5 15 27.5 15 27.5Z');
            animation: floatHeart linear forwards;
            z-index: -1;
            opacity: 0.7;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(45deg);
                opacity: 0;
            }
        }

        /* Interaction utility classes */
        .click-area { cursor: pointer; }
        .no-click { pointer-events: none; }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 sm:p-6 select-none click-area" id="main-body">

    <!-- AUDIO PLAYER (Hidden) -->
    <!-- Ensure your audio file is named "music.mp3" and sits in the same folder -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Background and Animation Layers -->
    <div class="bg-animated"></div>
    <div id="animation-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- MAIN TEXT CONTAINER (For the sequence of messages) -->
    <div id="text-container" class="absolute inset-0 flex items-center justify-center p-6 z-10 transition-all duration-1000 ease-in-out opacity-0 translate-y-4">
        <h1 id="main-text" class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-gray-800 font-medium leading-relaxed md:leading-tight drop-shadow-sm text-center serif-font">
            <!-- Text injected by JS -->
        </h1>
    </div>

    <!-- FINAL FRAME CONTAINER (Hidden initially) -->
    <div id="final-frame" class="absolute inset-0 flex items-center justify-center p-4 sm:p-8 z-20 transition-all duration-1000 ease-in-out opacity-0 translate-y-8 pointer-events-none">
        
        <div class="glass-card w-full rounded-3xl p-8 sm:p-12 text-center relative overflow-hidden flex flex-col items-center">
            
            <!-- Floating accent blobs behind the card content for depth -->
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-pulse pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-yellow-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-pulse pointer-events-none" style="animation-delay: 2s;"></div>

            <!-- ========================================== -->
            <!-- FINAL FRAME CONTENT                        -->
            <!-- ========================================== -->
            
            <!-- Portrait GIF inside Vertical Oval -->
            <div class="relative mb-6 border-[5px] border-white/90 shadow-xl overflow-hidden flex-shrink-0 oval-gif-container bg-pink-50/50 z-10">
                <img src="my-gif.gif" alt="My Portrait GIF" class="w-full h-full object-cover">
            </div>

            <!-- Final Heading -->
            <h2 class="text-4xl sm:text-5xl font-bold mb-3 text-gray-800 serif-font italic z-10">
                Happy Birthday, Strawberry!
            </h2>
            
            <!-- Final Subtext -->
            <p class="text-gray-700 text-lg sm:text-xl font-light z-10">
                I love you soooo, so much. Here's to many more! 🥂
            </p>
            <br>
            <p class="text-gray-700 text-xs font-light z-10">
                One of my gifts should have reached you by now; try to look for it if you didn't get notified. More surprises yet to come today ;))
            </p>
        </div>
    </div>

    <!-- Pulsing Instruction -->
    <div id="instruction" class="absolute bottom-8 z-30 opacity-0 transition-opacity duration-1000 ease-in-out pointer-events-none">
        <p class="text-xs sm:text-sm text-gray-600/80 uppercase tracking-widest animate-pulse font-medium">
            Tap anywhere to continue
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // EDIT YOUR MESSAGES HERE
            const messages = [
                "Hi, bby!",
                "Happiest 24th birthday to you.",
                "You have no idea how glad I am that we were born in the same generation.",
                "Kung meron mang isang tamang ginawa mama mo, ikaw yun :)) (jk lang po tita)",
                "So glad to have jumped the gun that time and messaged you cause otherwise, I wouldn't have the best thing life has to offer me.",
                "You have made my life so much more wonderful just by being a part of it.",
                "I loved and cherish every time we've had together.",
                "From the fun times, to the mundane moments, till the rainy days —",
                "All these to me mean so much for the story that we're carving out.",
                "Even now while we're apart, just seeing your beautiful smile,",
                "those gorgeous eyes,",
                "hearing your soothing voice,",
                "your contagious laugh —",
                "all through the phone has given me a greater purpose in life as a reason to keep striving.",
                "I wish I could've been there through your first 23 years, but I'll gladly take the chance to be there for the rest of your lifetime.",
                "May all your dreams and wishes in life happen and come to you.",
                " I'll always be cheering you on,",
                "celebrating your wins,",
                "comforting you through difficult times,",
                "and reminding you of how amazing you are whenever you need it.",
                "Keep safe, be healthy, be the happiest that you could be.",
                "Keep being the sunshine that you are."
                ];
            
            let currentIndex = 0;
            let isAnimating = false;
            let isFinished = false; 
            let audioPlayed = false; // Tracks if background music has started
            
            const body = document.getElementById('main-body');
            const textContainer = document.getElementById('text-container');
            const mainText = document.getElementById('main-text');
            const finalFrame = document.getElementById('final-frame');
            const instruction = document.getElementById('instruction');
            const animationLayer = document.getElementById('animation-layer');
            const bgMusic = document.getElementById('bg-music');

            // Initialize first message
            mainText.innerText = messages[currentIndex];
            
            // Fade in the first message slightly after load
            setTimeout(() => {
                textContainer.classList.remove('opacity-0', 'translate-y-4');
                textContainer.classList.add('opacity-100', 'translate-y-0');
                
                // Show instruction text shortly after
                setTimeout(() => {
                    instruction.classList.remove('opacity-0');
                    instruction.classList.add('opacity-100');
                }, 1500);
            }, 500);

            // Click event listener to progress text and play music
            body.addEventListener('click', () => {
                
                // Start music on the very first click/tap
                if (!audioPlayed) {
                    bgMusic.play().catch(e => console.log("Audio playback was blocked:", e));
                    audioPlayed = true;
                }

                // Prevent advancing if currently transitioning, or if we hit the end
                if (isAnimating || isFinished) return; 

                advanceSequence();
            });

            function advanceSequence() {
                isAnimating = true;

                // Fade out current text
                textContainer.classList.remove('opacity-100', 'translate-y-0');
                textContainer.classList.add('opacity-0', '-translate-y-4');

                setTimeout(() => {
                    currentIndex++;

                    if (currentIndex < messages.length) {
                        // Show Next Message
                        mainText.innerText = messages[currentIndex];
                        
                        // Reset transform for bottom-up fade in
                        textContainer.classList.remove('-translate-y-4');
                        textContainer.classList.add('translate-y-4');
                        
                        // Trigger reflow to ensure the transform reset applies instantly
                        void textContainer.offsetWidth; 

                        // Fade in new text
                        textContainer.classList.remove('opacity-0', 'translate-y-4');
                        textContainer.classList.add('opacity-100', 'translate-y-0');
                        
                        setTimeout(() => { isAnimating = false; }, 1000);

                    } else {
                        // End of sequence - Show Final Frame
                        isFinished = true;
                        
                        // Hide instruction permanently
                        instruction.classList.remove('opacity-100');
                        instruction.classList.add('opacity-0');
                        
                        // Disable click-to-advance cursor
                        body.classList.remove('click-area');

                        // Show final frame
                        finalFrame.classList.remove('pointer-events-none');
                        finalFrame.classList.remove('opacity-0', 'translate-y-8');
                        finalFrame.classList.add('opacity-100', 'translate-y-0');

                        // Start celebratory animation
                        startCelebration();
                    }
                }, 1000); // Wait for fade-out duration before changing content
            }

            function startCelebration() {
                // Initial burst of hearts
                for (let i = 0; i < 25; i++) {
                    setTimeout(() => spawnHeart(), i * 80);
                }
                
                // Continuous floating hearts
                setInterval(() => {
                    if (Math.random() > 0.4) spawnHeart();
                }, 400);
            }

            function spawnHeart() {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                
                const leftPos = Math.random() * 100;
                const size = Math.random() * 20 + 15; // 15px to 35px
                const duration = Math.random() * 5 + 5; // 5s to 10s
                
                // Romantic color palette
                const colors = ['#f43f5e', '#fb7185', '#fda4af', '#fecdd3', '#ffffff', '#fbcfe8'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                heart.style.left = `${leftPos}vw`;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.backgroundColor = color;
                heart.style.animationDuration = `${duration}s`;
                
                const sway = (Math.random() - 0.5) * 50;
                heart.style.transform = `translateX(${sway}px)`;

                animationLayer.appendChild(heart);

                // Clean up the DOM element after animation ends
                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);
            }
        });
    </script>
</body>
</html>
